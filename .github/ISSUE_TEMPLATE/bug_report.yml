name: Bug report
description: Report a reproducible ChatFacet appearance, selection, formula, or copying issue.
title: "[Bug]: "
labels: [bug, needs-triage]
body:
  - type: checkboxes
    attributes:
      label: Privacy check
      options:
        - label: I removed private chats, account data, document content, and credentials.
          required: true
  - type: input
    attributes:
      label: ChatFacet version
      description: The version is shown in the extension popup.
    validations:
      required: true
  - type: input
    attributes:
      label: Browser and version
      placeholder: Chrome 000 on Windows 11
    validations:
      required: true
  - type: input
    attributes:
      label: Site and Word version (if relevant)
      placeholder: chatgpt.com or gemini.google.com; include the Word version for paste issues
  - type: textarea
    attributes:
      label: Steps and minimal example
      description: Use public or synthetic text and formulas, not private conversation content.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
