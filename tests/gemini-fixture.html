<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Gemini formula selection regression</title>
  <link rel="stylesheet" href="../src/content.css">
</head>
<body>
  <model-response>
    <message-content>
      <p id="mixed">
        <span>Sample <span class="math-inline" data-math="\text{Me}_2\text{O}"><span class="katex">Me2O</span></span> and </span><span class="math-inline" data-math="\frac{p_1}{q^2}"><span class="katex">p/q</span></span><span> are paired with X<sub>3</sub> and y&#x207B;&#x00B9;.</span>
        <span class="math-inline" data-math="\unknown{z}"><span class="katex-error">unrendered source</span></span>
        <span class="math-inline" data-math="\outdated"><span class="katex"><span class="katex-mathml"><math><semantics><mrow><mi>f</mi></mrow><annotation encoding="application/x-tex">f(x)=x^2</annotation></semantics></math></span><span class="katex-html" aria-hidden="true">f(x)=x^2</span></span></span>
      </p>
      <div class="math-block" data-math="\sum_{i=1}^n i"><span class="katex-display"><span class="katex">sum</span></span></div>
    </message-content>
  </model-response>
  <output id="result">Pending</output>
  <script src="../src/vendor/katex.min.js"></script>
  <script src="../src/latex-normalizer.js"></script>
  <script src="../src/word-mathml.js"></script>
  <script src="../src/word-text.js"></script>
  <script>
    let clipboard;
    const writes = [];
    window.chrome = {
      i18n: { getMessage() { return ""; } },
      storage: { local: { get(defaults, callback) { callback(defaults); } } },
      runtime: { sendMessage(message, callback) {
        try {
          callback({ ok: true, mathml: WordMathml.latexToMathml(message.latex, katex) });
        } catch (error) {
          callback({ ok: false, error: error.message });
        }
      } }
    };
    window.ClipboardItem = class { constructor(data) { this.data = data; } };
    Object.defineProperty(navigator, "clipboard", { value: { async write(items) {
      clipboard = await items[0].data["text/html"].text();
      writes.push(clipboard);
    } } });
  </script>
  <script src="../src/content.js"></script>
  <script>
    const waitFor = async (test) => {
      for (let attempt = 0; attempt < 80; attempt += 1) {
        if (test()) return;
        await new Promise((resolve) => setTimeout(resolve, 25));
      }
      throw new Error("Timed out waiting for the copy action");
    };
    function select(range) {
      window.getSelection().removeAllRanges();
      window.getSelection().addRange(range);
      document.dispatchEvent(new Event("selectionchange"));
    }
    async function run() {
      const paragraph = document.getElementById("mixed");
      const [label, fraction, failed, annotation] = paragraph.querySelectorAll("[data-math]");
      const display = document.querySelector(".math-block");
      await waitFor(() => label.hasAttribute("data-wlc-text-label") &&
        fraction.getAttribute("data-wlc-recognized") === "inline" &&
        display.getAttribute("data-wlc-recognized") === "display");
      const range = document.createRange();
      range.setStart(label.querySelector(".katex").firstChild, 2);
      range.setEnd(annotation.querySelector(".katex-html").firstChild, 3);
      select(range);
      const selector = "#chatgpt-latex-selection-actions.is-visible button";
      await waitFor(() => document.querySelector(selector));
      document.querySelector(selector).click();
      await waitFor(() => writes.length === 1);
      if (!clipboard.includes("Me<sub>2</sub>O") || !clipboard.includes("X<sub>3</sub>") ||
          !clipboard.includes("y<sup>−1</sup>") || !clipboard.includes("<mfrac>") ||
          !clipboard.includes("<msup>") || !clipboard.includes("unrendered source") ||
          (clipboard.match(/<math\b/g) || []).length !== 2 ||
          failed.hasAttribute("data-wlc-recognized")) {
        throw new Error("Mixed selection lost a formula or a text script");
      }
      window.getSelection().removeAllRanges();
      display.firstElementChild.dispatchEvent(new PointerEvent("pointerover", { bubbles: true }));
      const quick = "#chatgpt-latex-quick-actions.is-visible [data-copy-mode='word']";
      await waitFor(() => document.querySelector(quick));
      document.querySelector(quick).click();
      await waitFor(() => writes.length === 2);
      if (!clipboard.includes("<munderover>")) throw new Error("Display equation lost its limits");
      document.getElementById("result").textContent = "PASS";
    }
    window.addEventListener("load", () => {
      run().catch((error) => { document.getElementById("result").textContent = "FAIL: " + error.message; });
    });
  </script>
</body>
</html>
