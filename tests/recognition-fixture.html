<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Formula Recognition Fixture</title>
    <link rel="stylesheet" href="../src/content.css">
    <style>
      body {
        background: #ffffff;
        color: #191c1f;
        font: 18px/1.6 Arial, sans-serif;
        margin: 0 auto;
        max-width: 800px;
        padding: 80px 24px;
      }
      .katex-display {
        margin: 32px 0;
        padding: 24px;
        text-align: center;
      }
      .katex-mathml {
        position: absolute;
        clip: rect(1px, 1px, 1px, 1px);
      }
    </style>
  </head>
  <body>
    <p>Move over the equation, then double-click it.</p>
    <span class="katex-display">
      <span class="katex">
        <span class="katex-mathml">
          <math display="block">
            <semantics>
              <mrow><mi>F</mi><mo>=</mo><mn>1</mn></mrow>
              <annotation encoding="application/x-tex">F(x;R)
=
\mathbf 1\!\left[x\leq R\right]
=1,</annotation>
            </semantics>
          </math>
        </span>
        <span class="katex-html" aria-hidden="true">F(x;R) = 1[x ≤ R]</span>
      </span>
    </span>
    <p>New renderer shape:</p>
    <span role="math" aria-label="x_{n+1} = x_n + 1" data-math-source="x_{n+1} = x_n + 1" data-client-katex-layout style="display: block;">
      <span class="katex-display"><span class="katex"><span class="katex-html" aria-hidden="true">xₙ₊₁ = xₙ + 1</span></span></span>
    </span>
    <span id="dynamic-math" role="math">y₁</span>
    <script>
      globalThis.__wlcStorageListeners = [];
      globalThis.chrome = {
        runtime: { lastError: null },
        storage: {
          local: {
            get(defaults, callback) { callback(defaults); }
          },
          onChanged: {
            addListener(listener) { globalThis.__wlcStorageListeners.push(listener); }
          }
        }
      };
    </script>
    <script src="../src/vendor/katex.min.js"></script>
    <script src="../src/latex-normalizer.js"></script>
    <script src="../src/word-mathml.js"></script>
    <script src="../src/word-text.js"></script>
    <script src="../src/content.js"></script>
    <script>
      window.setTimeout(() => {
        document.getElementById("dynamic-math").setAttribute("data-math-source", "y_1");
      }, 120);
      window.setTimeout(() => {
        const formula = document.querySelector("[data-math-source]");
        formula.dispatchEvent(new PointerEvent("pointerover", { bubbles: true, composed: true }));
        window.setTimeout(() => {
          const probe = document.createElement("output");
          probe.id = "settings-behavior-probe";
          probe.hidden = true;
          const visibleButtons = () => Array.from(
            document.querySelectorAll("#chatgpt-latex-quick-actions button:not([hidden])")
          ).map((button) => button.textContent);
          probe.dataset.defaultButtons = visibleButtons().join("|");
          document.body.appendChild(probe);
          globalThis.__wlcStorageListeners.forEach((listener) => listener({
            showLatexCopy: { oldValue: false, newValue: true }
          }, "local"));
          window.requestAnimationFrame(() => {
            probe.dataset.latexButtons = visibleButtons().join("|");
          });
        }, 60);
      }, 220);
      window.setTimeout(() => {
        const range = document.createRange();
        range.selectNodeContents(document.querySelector("[data-math-source]"));
        const selection = window.getSelection();
        selection.removeAllRanges();
        selection.addRange(range);
        document.dispatchEvent(new Event("selectionchange"));
      }, 500);
      window.setTimeout(() => {
        const probe = document.createElement("output");
        probe.id = "formula-boundary-probe";
        probe.hidden = true;
        probe.dataset.recognized = String(document.querySelectorAll("[data-wlc-recognized]").length);
        probe.dataset.textActionsVisible = String(
          Boolean(document.querySelector("#chatgpt-latex-selection-actions.is-visible"))
        );
        document.body.appendChild(probe);
      }, 900);
    </script>
  </body>
</html>
