<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Text selection fixture</title>
    <link rel="stylesheet" href="../src/content.css">
    <style>
      body {
        background: #f7f7f8;
        color: #17191c;
        font: 18px/1.55 Arial, "Microsoft YaHei UI", sans-serif;
        margin: 0 auto;
        max-width: 820px;
        padding: 108px 32px;
      }
      main { max-width: 680px; }
      .native-selection-actions {
        align-items: center;
        background: #ffffff;
        border: 1px solid #d8dce1;
        border-radius: 12px;
        box-shadow: 0 8px 24px rgba(28, 32, 36, 0.12);
        display: flex;
        gap: 0;
        padding: 4px;
        position: fixed;
        z-index: 50;
      }
      .native-selection-actions button {
        background: transparent;
        border: 0;
        border-radius: 8px;
        color: #17191c;
        font: 500 14px/1 Arial, "Microsoft YaHei UI", sans-serif;
        min-height: 34px;
        padding: 0 14px;
      }
      .native-selection-actions button + button { border-left: 1px solid #eceef0; }
      ::selection { background: #b9d5fb; color: inherit; }
    </style>
  </head>
  <body>
    <main>
      <p>选择正文后，页面原生操作位于上方，扩展操作自动放到选区下方。</p>
      <p id="selection-target"><strong>Sample A⁺ includes B₂ and C₃ values.</strong> The text also contains X₃⁻, Y₂⁻ and x⁻¹ y⁻² notation.</p>
      <p>普通正文的复制入口与自动识别公式保持独立。</p>
    </main>

    <div class="native-selection-actions" role="toolbar" aria-label="ChatGPT selection actions">
      <button type="button">询问 ChatGPT</button>
      <button type="button">开始写作</button>
    </div>

    <script>
      globalThis.chrome = {
        i18n: {
          getMessage(key) {
            const messages = {
              textQuickActions: "文本复制操作",
              copyTextWord: "复制文本到 Word",
              copiedTextWord: "文本已复制到 Word",
              copyTextWordFailed: "文本复制到 Word 失败"
            };
            return messages[key] || "";
          }
        },
        runtime: { lastError: null },
        storage: { local: { get(defaults, callback) { callback(defaults); } } }
      };
    </script>
    <script src="../src/latex-normalizer.js"></script>
    <script src="../src/word-mathml.js"></script>
    <script src="../src/word-text.js"></script>
    <script src="../src/content.js"></script>
    <script>
      window.addEventListener("load", () => {
        const target = document.getElementById("selection-target");
        const range = document.createRange();
        range.selectNodeContents(target);
        const selection = window.getSelection();
        selection.removeAllRanges();
        selection.addRange(range);

        const bounds = range.getBoundingClientRect();
        const native = document.querySelector(".native-selection-actions");
        native.style.left = `${Math.round(bounds.left)}px`;
        native.style.top = `${Math.round(bounds.top - native.offsetHeight - 8)}px`;

        const payload = WordTextClipboard.buildSelectionPayload(range, document);
        const probe = document.createElement("output");
        probe.id = "word-payload-probe";
        probe.hidden = true;
        probe.dataset.sup = String((payload.html.match(/<sup>/g) || []).length);
        probe.dataset.sub = String((payload.html.match(/<sub>/g) || []).length);
        probe.dataset.hasUnsafeAttributes = String(/\s(?:class|id|data-|on\w+)=/i.test(payload.html));
        document.body.appendChild(probe);
        document.dispatchEvent(new Event("selectionchange"));
      });
    </script>
  </body>
</html>
