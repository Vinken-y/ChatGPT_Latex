<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Text selection fixture</title>
    <link rel="stylesheet" href="../src/content.css">
    <style>
      body {
        background: #f7f7f8;
        color: #17191c;
        font: 18px/1.55 Arial, "Microsoft YaHei UI", sans-serif;
        margin: 0 auto;
        max-width: 820px;
        padding: 108px 32px;
      }
      main { max-width: 680px; }
      .native-selection-actions {
        align-items: center;
        background: #ffffff;
        border: 1px solid #d8dce1;
        border-radius: 12px;
        box-shadow: 0 8px 24px rgba(28, 32, 36, 0.12);
        display: flex;
        gap: 0;
        padding: 4px;
        position: fixed;
        z-index: 50;
      }
      .native-selection-actions button {
        background: transparent;
        border: 0;
        border-radius: 8px;
        color: #17191c;
        font: 500 14px/1 Arial, "Microsoft YaHei UI", sans-serif;
        min-height: 34px;
        padding: 0 14px;
      }
      .native-selection-actions button + button { border-left: 1px solid #eceef0; }
      ::selection { background: #b9d5fb; color: inherit; }
    </style>
  </head>
  <body>
    <main>
      <p>选择正文后，页面原生操作位于上方，扩展操作自动放到选区下方。</p>
      <p id="selection-target"><strong>Sample A⁺ includes B₂ values.</strong> The expression <span role="math" data-math-source="x^2"><span class="katex"><span class="katex-html" aria-hidden="true">x²</span></span></span> and charged label <span role="math" data-math-source="\mathrm{SO}_{4}^{2-}"><span class="katex"><span class="katex-html" aria-hidden="true">SO₄²⁻</span></span></span> appear inside ordinary text.</p>
      <p>普通正文的复制入口与自动识别公式保持独立。</p>
    </main>

    <div class="native-selection-actions" role="toolbar" aria-label="ChatGPT selection actions">
      <button type="button">询问 ChatGPT</button>
      <button type="button">开始写作</button>
    </div>

    <script>
      globalThis.__wlcSelectionStorageListeners = [];
      globalThis.chrome = {
        i18n: {
          getMessage(key) {
            const messages = {
              textQuickActions: "文本复制操作",
              copyTextWord: "复制文本到 Word",
              copiedTextWord: "文本已复制到 Word",
              copyTextWordFailed: "文本复制到 Word 失败"
            };
            return messages[key] || "";
          }
        },
        runtime: {
          lastError: null,
          sendMessage(message, callback) {
            callback({
              ok: true,
              mathml: '<math xmlns="http://www.w3.org/1998/Math/MathML"><msup><mi>x</mi><mn>2</mn></msup></math>'
            });
          }
        },
        storage: {
          local: { get(defaults, callback) { callback(defaults); } },
          onChanged: {
            addListener(listener) { globalThis.__wlcSelectionStorageListeners.push(listener); }
          }
        }
      };
      globalThis.ClipboardItem = class ClipboardItem {
        constructor(data) { this.data = data; }
      };
      Object.defineProperty(navigator, "clipboard", {
        configurable: true,
        value: {
          write(items) {
            globalThis.__wlcClipboardItems = items;
            return Promise.resolve();
          }
        }
      });
    </script>
    <script src="../src/latex-normalizer.js"></script>
    <script src="../src/word-mathml.js"></script>
    <script src="../src/word-text.js"></script>
    <script src="../src/content.js"></script>
    <script>
      window.addEventListener("load", () => {
        const target = document.getElementById("selection-target");
        const range = document.createRange();
        range.selectNodeContents(target);
        const selection = window.getSelection();
        selection.removeAllRanges();
        selection.addRange(range);

        const bounds = range.getBoundingClientRect();
        const native = document.querySelector(".native-selection-actions");
        native.style.left = `${Math.round(bounds.left)}px`;
        native.style.top = `${Math.round(bounds.top - native.offsetHeight - 8)}px`;

        const probe = document.createElement("output");
        probe.id = "word-payload-probe";
        probe.hidden = true;
        document.body.appendChild(probe);
        document.dispatchEvent(new Event("selectionchange"));
        window.setTimeout(async () => {
          const action = document.querySelector("#chatgpt-latex-selection-actions button");
          probe.dataset.mixedActionVisible = String(Boolean(action));
          action?.click();
          await new Promise((resolve) => window.setTimeout(resolve, 120));
          const item = globalThis.__wlcClipboardItems?.[0];
          const html = item ? await item.data["text/html"].text() : "";
          const plainText = item ? await item.data["text/plain"].text() : "";
          probe.dataset.mathCount = String((html.match(/<math\b/g) || []).length);
          probe.dataset.hasText = String(html.includes("Sample A"));
          probe.dataset.hasSup = String(html.includes("<sup>"));
          probe.dataset.hasIonText = String(html.includes("SO<sub>4</sub><sup>2−</sup>"));
          probe.dataset.hasUnsafeFormulaMarkup = String(/data-math-source|katex-html|class=["'][^"']*katex/i.test(html));
          probe.dataset.hasBold = String(/<(?:b|strong)\b|font-weight\s*:/i.test(html));
          probe.dataset.usesWordNormal = String(/class="MsoNormal"/i.test(html));
          probe.dataset.plainHasLatex = String(plainText.includes("x^2") && plainText.includes("SO42−"));
          const notifySetting = (key, oldValue, newValue) => {
            globalThis.__wlcSelectionStorageListeners.forEach((listener) => listener({
              [key]: { oldValue, newValue }
            }, "local"));
          };
          notifySetting("removeBoldFormatting", true, false);
          await new Promise((resolve) => window.setTimeout(resolve, 80));
          document.querySelector("#chatgpt-latex-selection-actions.is-visible button")?.click();
          await new Promise((resolve) => window.setTimeout(resolve, 120));
          const boldItem = globalThis.__wlcClipboardItems?.[0];
          const boldHtml = boldItem ? await boldItem.data["text/html"].text() : "";
          probe.dataset.boldWhenBoldRemovalDisabled = String(/<(?:b|strong)\b|font-weight\s*:/i.test(boldHtml));
          probe.dataset.normalWhenBoldRemovalDisabled = String(/class="MsoNormal"/i.test(boldHtml));
          notifySetting("removeBoldFormatting", false, true);
          await new Promise((resolve) => window.setTimeout(resolve, 80));
          notifySetting("matchWordFormatting", true, false);
          await new Promise((resolve) => window.setTimeout(resolve, 80));
          document.querySelector("#chatgpt-latex-selection-actions.is-visible button")?.click();
          await new Promise((resolve) => window.setTimeout(resolve, 120));
          const unmatchedItem = globalThis.__wlcClipboardItems?.[0];
          const unmatchedHtml = unmatchedItem ? await unmatchedItem.data["text/html"].text() : "";
          probe.dataset.boldWithOnlyFormattingDisabled = String(/<(?:b|strong)\b|font-weight\s*:/i.test(unmatchedHtml));
          probe.dataset.normalWhenFormattingDisabled = String(/class="MsoNormal"/i.test(unmatchedHtml));
          notifySetting("removeBoldFormatting", true, false);
          await new Promise((resolve) => window.setTimeout(resolve, 80));
          document.querySelector("#chatgpt-latex-selection-actions.is-visible button")?.click();
          await new Promise((resolve) => window.setTimeout(resolve, 120));
          const unformattedItem = globalThis.__wlcClipboardItems?.[0];
          const unformattedHtml = unformattedItem ? await unformattedItem.data["text/html"].text() : "";
          probe.dataset.boldWhenBothDisabled = String(/<(?:b|strong)\b|font-weight\s*:/i.test(unformattedHtml));
          probe.dataset.normalWhenBothDisabled = String(/class="MsoNormal"/i.test(unformattedHtml));
          notifySetting("removeBoldFormatting", false, true);
          await new Promise((resolve) => window.setTimeout(resolve, 80));
          notifySetting("matchWordFormatting", false, true);
          await new Promise((resolve) => window.setTimeout(resolve, 80));
          notifySetting("formulaRecognition", true, false);
          await new Promise((resolve) => window.setTimeout(resolve, 80));
          probe.dataset.mixedWithTextOnly = String(Boolean(
            document.querySelector("#chatgpt-latex-selection-actions.is-visible")
          ));
          notifySetting("formulaRecognition", false, true);
          await new Promise((resolve) => window.setTimeout(resolve, 80));
          probe.dataset.mixedWithBoth = String(Boolean(
            document.querySelector("#chatgpt-latex-selection-actions.is-visible")
          ));
          notifySetting("textRecognition", true, false);
          await new Promise((resolve) => window.setTimeout(resolve, 80));
          probe.dataset.mixedWithFormulaOnly = String(Boolean(
            document.querySelector("#chatgpt-latex-selection-actions.is-visible")
          ));
        }, 180);
      });
    </script>
  </body>
</html>
